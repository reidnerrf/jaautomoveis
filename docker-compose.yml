services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/JaAutomoveis
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      - mongo
    volumes:
      - ./uploads:/app/uploads
      - ./assets:/app/assets
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: JaAutomoveis
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mongodb_data: