    <script>
      // Apply a11y preferences from localStorage
      try {
        if (localStorage.getItem('pref_reduce_motion') === '1') {
          document.documentElement.classList.add('reduce-motion');
        }
        if (localStorage.getItem('pref_text_spacing') === '1') {
          document.documentElement.classList.add('text-spacing');
        }
      } catch (e) {}
    </script>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var hour = new Date().getHours();
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var shouldDark = stored ? stored === 'dark' : (prefersDark || hour >= 19 || hour < 6);
          if (shouldDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) { /* ignore */ }
      })();
    </script>
